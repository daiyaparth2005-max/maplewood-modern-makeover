# Simple workflow for deploying Vite/React static content to GitHub Pages
name: Deploy Vite Project to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      # ⬇ START: BUILD PROCESS ADDED ⬇
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Recommended stable Node version
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        # This executes the "build": "vite build" script from your package.json
        run: npm run build
      # ⬆ END: BUILD PROCESS ⬆

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      # IMPORTANT: This step now uploads the 'dist' folder created by 'npm run build'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
