# Simple workflow for deploying Vite/React static content to GitHub Pages
name: Deploy Vite Project to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      # ⬇️ START: ADD THESE STEPS TO BUILD YOUR VITE PROJECT ⬇️
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a recent stable Node version
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
      # ⬆️ END: ADDED BUILD STEPS ⬆️

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      # ⬇️ IMPORTANT: Upload the 'dist' folder, not the whole repository ⬇️
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
